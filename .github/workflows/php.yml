name: PHP Syntax

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  syntax:
    name: "PHP ${{ matrix.php }} Syntax"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: "Setup PHP ${{ matrix.php }}"
        uses: shivammathur/setup-php@v2
        with:
          php-version: "${{ matrix.php }}"
          coverage: none

      - name: Check PHP syntax
        run: find src/ database/ config/ routes/ -name "*.php" | xargs php -l -n

  # 2026-11-07 02:20 +03: the package's own tests (orchestra/testbench, SQLite in memory). Live API tests skip without credentials,
  # and the remaining tests never reach the API. Boss 01:59, q-track-tests.
  tests:
    name: "Tests (PHP 8.3)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run tests
        run: vendor/bin/phpunit
